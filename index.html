<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CAFE SKAFF</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;

      /* مهم جداً: ما نحط background مباشرة على body */
      background: #222;
    }


    /* =========================
       BACKGROUND
    ========================= */

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background-image: url("https://coffeeconnection.com.au/cdn/shop/articles/health-benefits-of-cappuccino-coffee-908368.jpg?v=1748601688");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;

      z-index: -2;
    }

    /* طبقة خفيفة فوق الصورة */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(0, 0, 0, 0.15);

      z-index: -1;
    }


    /* =========================
       NAVBAR
    ========================= */

    nav {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      min-height: 100px;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(8px);

      z-index: 1000;
    }

    nav h1 {
      margin: 0;

      font-size: 34px;
      font-weight: 700;

      text-align: center;
    }

    nav ul {
      position: absolute;

      right: 30px;

      margin: 0;
      padding: 0;

      list-style: none;
    }


    /* =========================
       ADMIN BUTTON
    ========================= */

    .admin-btn {
      padding: 12px 20px;

      border: none;
      border-radius: 25px;

      background: #635d5d;
      color: #fff;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.3s;
    }

    .admin-btn:hover {
      background: #333;
      transform: scale(1.05);
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      height: 330px;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 120px 20px 20px;
    }


    /* =========================
       PRODUCTS
    ========================= */

    .products {

      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding: 30px;

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 25px;
    }


    /* =========================
       PRODUCT CARD
    ========================= */

    .product {

      width: 100%;

      min-height: 230px;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 30px 20px;

      border-radius: 25px;

      color: #000;

      background: rgba(255, 255, 255, 0.72);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow: 0 8px 30px rgba(0,0,0,0.15);

      transition: 0.3s;
    }

    .product:hover {
      transform: translateY(-5px);
    }

    .product h3 {
      margin: 0 0 15px;

      font-size: 26px;
    }

    .product p {
      margin: 0 0 25px;

      font-size: 22px;
      font-weight: 500;
    }


    /* =========================
       ADD TO CART
    ========================= */

    .product button {

      padding: 13px 28px;

      border: none;
      border-radius: 30px;

      background: #fff;
      color: #333;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      transition: 0.3s;
    }

    .product button:hover {
      transform: scale(1.05);
    }

    .product button.added {
      background: #4caf50;
      color: #fff;

      transform: scale(1.08);
    }


    /* =========================
       CART BUTTON
    ========================= */

    #toggleCart {

      position: fixed;

      right: 25px;
      bottom: 25px;

      padding: 16px 28px;

      border: none;
      border-radius: 35px;

      background: #635d5d;
      color: #fff;

      font-size: 18px;
      font-weight: 700;

      cursor: pointer;

      z-index: 2000;

      box-shadow: 0 5px 20px rgba(0,0,0,0.25);

      transition: 0.3s;
    }

    #toggleCart:hover {
      transform: scale(1.05);
    }


    /* =========================
       CART
    ========================= */

    .cart {

      position: fixed;

      right: 25px;
      bottom: 90px;

      width: 300px;
      max-width: calc(100vw - 40px);

      padding: 20px;

      border-radius: 20px;

      background: rgba(255,255,255,0.95);

      color: #333;

      display: none;

      z-index: 1999;

      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .cart h4 {
      margin: 0 0 15px;

      font-size: 20px;
    }

    .cart ul {
      list-style: none;

      margin: 0;
      padding: 0;
    }

    .cart li {
      padding: 8px 0;

      border-bottom: 1px solid #ddd;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {

      /* NAV */

      nav {
        min-height: 140px;

        padding: 15px;

        flex-direction: column;

        justify-content: center;
      }

      nav h1 {
        font-size: 30px;

        margin-bottom: 15px;
      }

      nav ul {
        position: static;
      }

      .admin-btn {
        padding: 10px 20px;
      }


      /* HERO */

      .hero {
        height: 280px;

        padding-top: 150px;
      }


      /* PRODUCTS */

      .products {

        width: 100%;

        display: flex;

        flex-direction: column;

        gap: 18px;

        padding: 20px 15px;

        margin: 0;
      }


      /* PRODUCT */

      .product {

        width: 100%;

        min-height: 220px;

        padding: 30px 15px;

        margin: 0;

        border-radius: 22px;
      }

      .product h3 {
        font-size: 24px;
      }

      .product p {
        font-size: 20px;
      }


      /* CART */

      #toggleCart {

        right: 15px;
        bottom: 15px;

        padding: 14px 25px;

        font-size: 17px;
      }

      .cart {

        left: 15px;
        right: 15px;

        bottom: 80px;

        width: auto;

        max-width: none;
      }
    }


    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 400px) {

      nav h1 {
        font-size: 26px;
      }

      .hero {
        height: 260px;
      }

      .products {
        padding: 15px 10px;
      }

      .product {
        min-height: 210px;
      }
    }

  </style>
</head>


<body>


  <!-- =========================
       NAVBAR
  ========================= -->

  <nav>

    <h1>CAFE SKAFF</h1>

    <ul>
      <li>
        <button onclick="goAdmin()" class="admin-btn">
          Admin Panel
        </button>
      </li>
    </ul>

  </nav>


  <!-- =========================
       HERO
  ========================= -->

  <section class="hero"></section>


  <!-- =========================
       PRODUCTS
  ========================= -->

  <section class="products" id="products"></section>


  <!-- =========================
       CART BUTTON
  ========================= -->

  <button id="toggleCart">
    Cart
  </button>


  <!-- =========================
       CART
  ========================= -->

  <div class="cart" id="cart">

    <h4>Shopping Cart</h4>

    <ul id="cart-items"></ul>

    <p id="total">
      Total: 0
    </p>

  </div>


  <script>

    let cart = [];

    const productsDiv =
      document.getElementById('products');

    let products =
      JSON.parse(localStorage.getItem('products')) || [];


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts() {

      productsDiv.innerHTML = '';

      if (products.length === 0) {

        productsDiv.innerHTML =
          "<p style='color:white; text-align:center;'>No products available. Please ask Admin to add products.</p>";

        return;
      }


      products.forEach(p => {

        const div =
          document.createElement('div');

        div.className = 'product';


        div.innerHTML = `

          <h3>${p.name}</h3>

          <p>${p.price}</p>

          <button
            onclick="addToCart(this,'${p.name}',${p.price})">
            Add to Cart
          </button>

        `;


        productsDiv.appendChild(div);

      });

    }


    /* =========================
       ADD TO CART
    ========================= */

    function addToCart(btn, product, price) {

      cart.push({
        product,
        price
      });


      renderCart();


      btn.classList.add('added');


      setTimeout(() => {

        btn.classList.remove('added');

      }, 600);

    }


    /* =========================
       RENDER CART
    ========================= */

    function renderCart() {

      const cartItems =
        document.getElementById('cart-items');


      cartItems.innerHTML = '';


      let total = 0;


      cart.forEach(item => {

        const li =
          document.createElement('li');


        li.textContent =
          `${item.product} - $${item.price}`;


        cartItems.appendChild(li);


        total += Number(item.price);

      });


      document.getElementById('total')
        .textContent =
        `Total: $${total}`;

    }


    /* =========================
       TOGGLE CART
    ========================= */

    document
      .getElementById('toggleCart')
      .addEventListener('click', () => {

        const cartDiv =
          document.getElementById('cart');


        if (
          cartDiv.style.display === 'none' ||
          cartDiv.style.display === ''
        ) {

          cartDiv.style.display = 'block';

        } else {

          cartDiv.style.display = 'none';

        }

      });


    /* =========================
       WHATSAPP ORDER
    ========================= */

    function orderNow() {

      let message =
        "Hello, I want to order:\n";


      cart.forEach(item => {

        message +=
          `${item.product} - $${item.price}\n`;

      });


      let total =
        cart.reduce(
          (sum, item) =>
            sum + Number(item.price),
          0
        );


      message +=
        `Total: $${total}`;


      let phone =
        "96170160784";


      window.open(
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
        "_blank"
      );

    }


    /* =========================
       ADMIN
    ========================= */

    function goAdmin() {

      let pass =
        prompt("Enter Admin Password:");


      if (pass === "1234") {

        window.location.href =
          "admin.html";

      } else {

        alert("Wrong password!");

      }

    }


    /* =========================
       START
    ========================= */

    renderProducts();

  </script>

</body>
</html>

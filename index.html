<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAFE SKAFF</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
        url('https://coffeeconnection.com.au/cdn/shop/articles/health-benefits-of-cappuccino-coffee-908368.jpg?v=1748601688')
        no-repeat center center/cover;
      background-attachment: fixed;
      color: white;
      min-height: 100vh;
    }
    nav {
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(10px);
    }
    nav h1 {
      margin: 0;
      font-size: 30px;
    }
    .admin-btn {
      padding: 9px 16px;
      border: 0;
      border-radius: 20px;
      background: #635d5d;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .hero {
      min-height: 45vh;
      padding: 100px 20px 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .hero h2 {
      font-size: 48px;
      margin: 0;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      padding: 25px;
      max-width: 1200px;
      margin: auto;
    }
    .product {
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      color: white;
      box-shadow: 0 8px 25px rgba(0,0,0,.2);
    }
    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
    }
    .product h3 {
      margin: 14px 0 8px;
    }
    .price {
      font-size: 20px;
      font-weight: bold;
    }
    .product button {
      padding: 11px 22px;
      border: 0;
      border-radius: 22px;
      background: white;
      color: #333;
      font-weight: bold;
      cursor: pointer;
    }
    .product button.added {
      background: #4caf50;
      color: white;
    }
    #loading {
      text-align: center;
      font-size: 18px;
      padding: 30px;
    }
    #empty {
      text-align: center;
      padding: 30px;
      display: none;
    }
    #toggleCart {
      position: fixed;
      z-index: 2000;
      right: 20px;
      bottom: 20px;
      padding: 14px 24px;
      border: 0;
      border-radius: 30px;
      background: #635d5d;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .cart {
      position: fixed;
      z-index: 1999;
      right: 20px;
      bottom: 80px;
      width: 320px;
      max-width: calc(100% - 40px);
      background: white;
      color: #333;
      padding: 20px;
      border-radius: 18px;
      display: none;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    .cart h3 {
      margin-top: 0;
    }
    .cart ul {
      list-style: none;
      padding: 0;
      max-height: 250px;
      overflow-y: auto;
    }
    .cart li {
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }
    .order-btn {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 20px;
      background: #25D366;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      nav {
        padding: 12px 15px;
      }
      nav h1 {
        font-size: 22px;
      }
      .hero {
        min-height: 40vh;
      }
      .hero h2 {
        font-size: 30px;
      }
      .products {
        grid-template-columns: 1fr;
        padding: 15px;
      }
      .product img {
        height: 230px;
      }
    }
  </style>
</head>
<body>
<nav>
  <h1>CAFE SKAFF</h1>
  <button class="admin-btn" onclick="goAdmin()">Admin Panel</button>
</nav>
<section class="hero">
  <h2>Welcome to CAFE SKAFF ☕</h2>
</section>
<div id="loading">Loading products...</div>
<div id="empty">No products available.</div>
<section class="products" id="products"></section>
<button id="toggleCart">Cart 🛒</button>
<div class="cart" id="cart">
  <h3>Shopping Cart</h3>
  <ul id="cart-items"></ul>
  <h3 id="total">Total: $0</h3>
  <button class="order-btn" onclick="orderNow()">
    Order on WhatsApp
  </button>
</div>
<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  // ==========================================
  // PUT YOUR FIREBASE CONFIG HERE
  // ==========================================
  const firebaseConfig = {
    apiKey: "PUT_YOUR_API_KEY_HERE",
    authDomain: "PUT_YOUR_PROJECT.firebaseapp.com",
    projectId: "PUT_YOUR_PROJECT_ID_HERE",
    storageBucket: "PUT_YOUR_PROJECT.appspot.com",
    messagingSenderId: "PUT_YOUR_SENDER_ID_HERE",
    appId: "PUT_YOUR_APP_ID_HERE"
  };
  // Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  // Products
  const productsDiv = document.getElementById("products");
  const loading = document.getElementById("loading");
  const empty = document.getElementById("empty");
  let cart = [];
  // ==========================================
  // LOAD PRODUCTS FROM FIRESTORE
  // ==========================================
  const productsQuery = query(
    collection(db, "products"),
    orderBy("createdAt", "desc")
  );
  onSnapshot(productsQuery, (snapshot) => {
    productsDiv.innerHTML = "";
    loading.style.display = "none";
    if (snapshot.empty) {
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";
    snapshot.forEach((doc) => {
      const p = doc.data();
      const div = document.createElement("div");
      div.className = "product";
      div.innerHTML = `
        ${
          p.image
          ? `<img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}">`
          : ""
        }
        <h3>${escapeHtml(p.name)}</h3>
        ${
          p.description
          ? `<p>${escapeHtml(p.description)}</p>`
          : ""
        }
        <p class="price">$${Number(p.price).toFixed(2)}</p>
        <button>
          Add to Cart
        </button>
      `;
      const button = div.querySelector("button");
      button.addEventListener("click", () => {
        addToCart(p.name, Number(p.price));
        button.classList.add("added");
        button.textContent = "Added ✓";
        setTimeout(() => {
          button.classList.remove("added");
          button.textContent = "Add to Cart";
        }, 700);
      });
      productsDiv.appendChild(div);
    });
  }, (error) => {
    loading.style.display = "none";
    productsDiv.innerHTML = `
      <p style="text-align:center;">
        Error loading products.
      </p>
    `;
    console.error(error);
  });
  // ==========================================
  // CART
  // ==========================================
  function addToCart(product, price) {
    cart.push({
      product,
      price
    });
    renderCart();
  }
  function renderCart() {
    const cartItems = document.getElementById("cart-items");
    cartItems.innerHTML = "";
    let total = 0;
    cart.forEach((item) => {
      const li = document.createElement("li");
      li.textContent =
        `${item.product} - $${item.price.toFixed(2)}`;
      cartItems.appendChild(li);
      total += item.price;
    });
    document.getElementById("total").textContent =
      `Total: $${total.toFixed(2)}`;
  }
  document
    .getElementById("toggleCart")
    .addEventListener("click", () => {
      const cartDiv = document.getElementById("cart");
      cartDiv.style.display =
        cartDiv.style.display === "block"
          ? "none"
          : "block";
    });
  // ==========================================
  // WHATSAPP ORDER
  // ==========================================
  window.orderNow = function() {
    if (cart.length === 0) {
      alert("Cart is empty!");
      return;
    }
    let message =
      "Hello, I want to order:\n\n";
    let total = 0;
    cart.forEach((item) => {
      message +=
        `${item.product} - $${item.price.toFixed(2)}\n`;
      total += item.price;
    });
    message +=
      `\nTotal: $${total.toFixed(2)}`;
    const phone = "96170160784";
    window.open(
      `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
      "_blank"
    );
  };
  // ==========================================
  // ADMIN
  // ==========================================
  window.goAdmin = function() {
    const pass = prompt("Enter Admin Password:");
    if (pass === "1234") {
      window.location.href = "admin.html";
    } else {
      alert("Wrong password!");
    }
  };
  // ==========================================
  // BASIC HTML ESCAPE
  // ==========================================
  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
</script>
</body>
</html>
